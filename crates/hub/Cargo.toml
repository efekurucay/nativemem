[package]
name = "nativemem-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nativemem-fake-mcp"
path = "src/bin/fake_mcp.rs"
test = false
doc = false

[dependencies]
http = "1.5.0"
keyring = "4.2.0"
nativemem-core = { path = "../core" }
rmcp = { version = "3.9", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-std", "sync"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3"
