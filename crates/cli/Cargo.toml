[package]
name = "nativemem-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nativemem"
path = "src/main.rs"

[dependencies]
nativemem-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1.0.154"
nativemem-hub = { path = "../hub" }

[dev-dependencies]
base64 = "0.22"
rmcp = { version = "3.9", features = ["client", "transport-child-process"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net"] }
